[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tableclear"
version = "0.1.0"
description = "Fixed-arm tabletop clearing harness for LIBERO and SmolVLA"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "TableClear contributors"}]
dependencies = []

[project.scripts]
tableclear = "tableclear.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tableclear = ["py.typed"]

