            type: string
            minLength: 1
        required: [obs, task]
      output:
        type: object
        properties:
          actions:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 7
              maxItems: 7
            minItems: 1
            maxItems: 50
        required: [actions]
