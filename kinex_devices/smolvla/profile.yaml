name: smolvla
type: model
loaded: false
access:
  source: user
  connection:
    kind: process
    compute:
      kind: cuda
      index: 0
  driver:
    entry: driver.py
    interpreter: ../../model-python/bin/python
    actions:
      - read
      - load
      - unload
      - status
      - infer
    persistent: true
    timeout_s: 600
intrinsics:
  source: user
  family: smolvla
  variant: "lerobot/smolvla_libero@a24f1f380461b665158d52acd140152c79e8b36d"
