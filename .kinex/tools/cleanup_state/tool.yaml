name: cleanup_state
kind: controller
description: Initialize, read, or update the object-level state for a table-clearing episode.
timeout_s: 30
parameters:
  type: object
  properties:
    action:
      type: string
      enum: [init, get, update]
      description: State operation to perform.
    task_id:
      type: string
      description: Task identifier; required for init.
    objects:
      type: array
      items:
        type: string
      description: Visible object labels; required for init.
    target_id:
      type: string
      description: Object identifier; required for update.
    status:
      type: string
      enum: [pending, grasped, in_basket, missing, lost_grip, blocked, unreachable]
      description: New object status; required for update.
    location:
      type: string
      description: Optional visible region label for update.
    evidence:
      type: string
      description: Short visual evidence for the status update.
  required: [action]

