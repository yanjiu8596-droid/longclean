name: run_policy
kind: controller
description: "Infer once, convert the SmolVLA Cartesian action chunk through IK, and submit the shared valid prefix."
parameters:
  type: object
  additionalProperties: false
  properties:
    model:
      type: string
      description: Model device serving an infer operation.
    observation:
      type: object
      additionalProperties: false
      properties:
        camera1:
          type: string
          format: path
        camera2:
          type: string
          format: path
        state:
          type: array
          minItems: 8
          maxItems: 8
          items:
            type: number
      required: [camera1, camera2, state]
    inference_args:
      type: object
      description: Additional infer arguments; obs and task cannot be overridden.
    command:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        properties:
          device:
            type: string
          space:
            type: string
            enum: [device, pose, pose_delta]
            default: device
          frame:
            type: string
          target_frame:
            type: string
          scale:
            type: array
            items:
              type: number
            minItems: 1
            maxItems: 7
          clip:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
        required: [device]
    task:
      type: string
    action_hz:
      type: number
      exclusiveMinimum: 0
      default: 10
    max_actions:
      type: integer
      minimum: 1
  required: [model, observation, command]
timeout_s: 600
device_inputs:
  model:
    types: [model]
  command[].device:
    types: [joint, gripper, dexterous_hand, suction]
